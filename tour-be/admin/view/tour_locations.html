<!-- admin\view\tour_locations.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý Địa điểm Tour</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/tour_locations.css" />

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
</head>

<body>
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Quản lý địa điểm Tour</h3>
      <button id="btnAdd" class="btn btn-primary">+ Thêm địa điểm</button>
    </div>

    <table class="table table-bordered table-hover align-middle">
      <thead class="table-primary">
        <tr>
          <th>ID</th>
          <th>Tour</th>
          <th>Tên địa điểm</th>
          <th>Mô tả</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="locationTableBody">
        <tr><td colspan="7" class="text-center">Đang tải...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="formTitle">Thêm địa điểm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form id="locationForm">
          <div class="modal-body">

            <input type="hidden" id="editId">

            <div class="row g-3">

              <!-- LEFT FORM -->
              <div class="col-md-6">
                <label class="fw-bold">Chọn Tour</label>
                <select id="tourSelect" class="form-select mb-3" required></select>

                <label class="fw-bold">Tên địa điểm</label>
                <input id="locationName" class="form-control mb-2" required>

                <label class="fw-bold">Mô tả</label>
                <textarea id="description" class="form-control mb-2"></textarea>

                <label class="fw-bold">Latitude</label>
                <input id="latitude" class="form-control mb-2" required>

                <label class="fw-bold">Longitude</label>
                <input id="longitude" class="form-control mb-2" required>

                <small class="text-muted">
                  Nhấp vào bản đồ → tự động cập nhật Tên + Lat + Lng
                </small>
              </div>

              <!-- MAP -->
              <div class="col-md-6">
                <div id="mapModal"></div>
              </div>

            </div>
          </div>

          <div class="modal-footer">
            <button id="saveBtn" class="btn btn-success" type="submit">Lưu</button>
            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Hủy</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script>
    fetch("sidebar.html").then(res => res.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tour_locations.js"></script>
</body>
</html>
