<!-- admin/view/tour.html -->
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Tour</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/tour.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sách Tour</h3>
        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#addModal"
        >
          + Thêm Tour
        </button>
      </div>

      <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>ID</th>
            <th>Tên tour</th>
            <th>Số người</th>
            <th>Ngày đi</th>
            <th>Ngày về</th>
            <th>Điểm khởi hành</th>
            <th>Điểm đến</th>
            <th>Loại tour</th>
            <th>Kiểu tour</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="tourTableBody">
          <tr>
            <td colspan="11" class="text-center">Đang tải...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="modal fade" id="addModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form id="tourForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Thêm Tour</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId" />

            <div class="row g-3">
              <div class="col-md-6">
                <label>Tên tour</label>
                <input type="text" class="form-control" id="name" required />
              </div>
              <div class="col-md-6">
                <label>Số người</label>
                <input
                  type="number"
                  class="form-control"
                  id="number_of_people"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Ngày khởi hành</label>
                <input
                  type="date"
                  class="form-control"
                  id="start_date"
                  required
                />
              </div>
              <div class="col-md-6">
                <label>Ngày kết thúc</label>
                <input
                  type="date"
                  class="form-control"
                  id="end_date"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Điểm khởi hành</label>
                <input
                  type="text"
                  class="form-control"
                  id="departure_address"
                  required
                />
              </div>
              <div class="col-md-6">
                <label>Điểm đến</label>
                <input
                  type="text"
                  class="form-control"
                  id="destination_address"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Danh mục Tour</label>
                <select class="form-select" id="tour_category_id" required>
                  <option value="">-- Chọn danh mục --</option>
                </select>
              </div>

              <div class="col-md-6">
                <label>Loại Tour</label>
                <div
                  id="tourTypeCheckboxes"
                  class="border rounded p-2"
                  style="max-height: 150px; overflow-y: auto"
                ></div>
              </div>

              <div class="col-md-6">
                <label>Trạng thái</label>
                <div class="d-flex gap-3 mt-1">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="status"
                      id="active"
                      value="Hoạt động"
                      checked
                    />
                    <label class="form-check-label" for="active"
                      >Hoạt động</label
                    >
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="status"
                      id="inactive"
                      value="Không hoạt động"
                    />
                    <label class="form-check-label" for="inactive"
                      >Không hoạt động</label
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="../js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tour.js"></script>
  </body>
</html>
