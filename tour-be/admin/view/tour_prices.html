<!-- admin/view/tour_prices.html -->
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý thành phần Tour</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/tour_prices.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="row g-4">
        <!-- BẢNG GIÁ TOUR -->
        <div class="col-lg-6 col-md-12">
          <div class="card shadow-sm">
            <div
              class="card-header bg-success text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Bảng giá Tour</h5>
              <button
                class="btn btn-light btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#priceModal"
              >
                + Thêm
              </button>
            </div>
            <div class="card-body table-container">
              <table class="table table-bordered table-hover table-sm">
                <thead class="table-success">
                  <tr>
                    <th>ID</th>
                    <th>Người lớn</th>
                    <th>Trẻ em</th>
                    <th>Từ</th>
                    <th>Đến</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="priceTableBody">
                  <tr>
                    <td colspan="6" class="text-center">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- GÁN TOUR VỚI BẢNG GIÁ -->
        <div class="col-lg-6 col-md-12">
          <div class="card shadow-sm">
            <div
              class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Gán Tour với Bảng Giá</h5>
              <button
                class="btn btn-light btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#assignModal"
              >
                + Gán
              </button>
            </div>
            <div class="card-body table-container">
              <table class="table table-bordered table-hover table-sm">
                <thead class="table-primary">
                  <tr>
                    <th>ID</th>
                    <th>Tour</th>
                    <th>Người lớn</th>
                    <th>Trẻ em</th>
                    <th>Hiệu lực</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="assignTableBody">
                  <tr>
                    <td colspan="6" class="text-center">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Thêm Bảng Giá -->
    <div class="modal fade" id="priceModal" tabindex="-1">
      <div class="modal-dialog">
        <form id="priceForm" class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Thêm Bảng Giá</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editPriceId" />
            <div class="mb-3">
              <label>Giá người lớn</label
              ><input
                type="number"
                class="form-control"
                id="priceAdult"
                required
              />
            </div>
            <div class="mb-3">
              <label>Giá trẻ em</label
              ><input
                type="number"
                class="form-control"
                id="priceChild"
                required
              />
            </div>
            <div class="mb-3">
              <label>Hiệu lực từ</label
              ><input type="date" class="form-control" id="validFrom" />
            </div>
            <div class="mb-3">
              <label>Hiệu lực đến</label
              ><input type="date" class="form-control" id="validTo" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Gán Tour -->
    <div class="modal fade" id="assignModal" tabindex="-1">
      <div class="modal-dialog">
        <form id="assignForm" class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Gán Tour với Bảng Giá</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label>Chọn Tour</label
              ><select id="tourSelect" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label>Chọn Bảng Giá</label
              ><select id="priceSelect" class="form-select" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Gán</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="../js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tour_prices.js"></script>
  </body>
</html>
