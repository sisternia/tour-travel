<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Đơn hàng</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/tour_guide.css" />
    <link rel="stylesheet" href="../css/orders.css" />
  </head>

  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sách Đơn hàng Tour</h3>
        <button class="btn btn-danger" onclick="deleteSelectedOrders()">
          <i class="bi bi-trash"></i> Xóa đã chọn
        </button>
      </div>

      <div class="card p-3 mb-3">
        <div class="row g-3">
          <div class="col-md-4">
            <label>Tìm kiếm (Tên / Email / SĐT)</label>
            <input
              type="text"
              id="searchKeyword"
              class="form-control"
              placeholder="Nhập từ khóa..."
            />
          </div>

          <div class="col-md-3">
            <label>Trạng thái</label>
            <select id="filterStatus" class="form-select">
              <option value="">-- Tất cả --</option>
              <option value="1">Đang chờ xác nhận</option>
              <option value="2">Đã xác nhận</option>
              <option value="3">Đã thanh toán</option>
            </select>
          </div>

          <div class="col-md-2">
            <label>Từ ngày</label>
            <input type="date" id="startDate" class="form-control" />
          </div>

          <div class="col-md-2">
            <label>Đến ngày</label>
            <input type="date" id="endDate" class="form-control" />
          </div>

          <div class="col-md-1 d-flex align-items-end">
            <button class="btn btn-secondary w-100" onclick="resetFilters()">
              <i class="bi bi-arrow-repeat"></i>
            </button>
          </div>
        </div>
      </div>

      <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>
              <input
                type="checkbox"
                id="selectAll"
                onclick="toggleSelectAll()"
              />
            </th>
            <th>ID</th>
            <th>Tour ID</th>
            <th>Tên khách</th>
            <th>SĐT</th>
            <th>Email</th>
            <th>Người lớn</th>
            <th>Trẻ em</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Ngày đặt</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody id="orderTableBody">
          <tr>
            <td colspan="12" class="text-center">Đang tải...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="modal fade" id="orderDetailModal">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Chi tiết đơn hàng</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div id="orderDetailContent">Đang tải...</div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/orders.js"></script>
  </body>
</html>
