<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Hướng dẫn viên</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/tour_guide.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sách Hướng dẫn viên</h3>
        <button
          class="btn btn-success"
          data-bs-toggle="modal"
          data-bs-target="#addGuideModal"
        >
          Thêm HDV mới
        </button>
      </div>

      <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Ngày sinh</th>
            <th>Giới tính</th>
            <th>Ngôn ngữ</th>
            <th>Chứng chỉ</th>
            <th>Địa chỉ</th>
            <th>Avatar</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="guideTableBody">
          <tr>
            <td colspan="10" class="text-center">Đang tải...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="modal fade" id="addGuideModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <form id="guideForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Thêm Hướng dẫn viên</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editGuideId" />

            <div class="row g-3">
              <div class="col-md-6">
                <label>Tên</label>
                <input
                  type="text"
                  class="form-control"
                  id="guide_name"
                  required
                />
              </div>
              <div class="col-md-6">
                <label>Email</label>
                <input type="email" class="form-control" id="email" required />
              </div>
              <div class="col-md-6">
                <label>Phone</label>
                <input type="text" class="form-control" id="phone" required />
              </div>
              <div class="col-md-6">
                <label>Ngày sinh</label>
                <input type="date" class="form-control" id="birthday" />
              </div>
              <div class="col-md-6">
                <label>Giới tính</label>
                <select class="form-select" id="gender">
                  <option value="">-- Chọn giới tính --</option>
                  <option value="Nam">Nam</option>
                  <option value="Nữ">Nữ</option>
                  <option value="Khác">Khác</option>
                </select>
              </div>
              <div class="col-md-6">
                <label>Ngôn ngữ</label>
                <input
                  type="text"
                  class="form-control"
                  id="language_job"
                  placeholder="VD: Tiếng Anh, Tiếng Nhật"
                />
              </div>

              <div class="col-md-6">
                <label>Chứng chỉ</label>
                <input
                  type="file"
                  class="form-control"
                  id="certification"
                  multiple
                  accept=".pdf,image/*"
                />
              </div>

              <div class="col-md-6">
                <label>Địa chỉ</label>
                <input type="text" class="form-control" id="address" />
              </div>
              <div class="col-md-6">
                <label>Avatar</label>
                <input
                  type="file"
                  class="form-control"
                  id="avatar_image"
                  accept="image/*"
                />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tour_guide.js"></script>
  </body>
</html>
