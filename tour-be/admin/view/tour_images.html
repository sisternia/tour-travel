<!-- admin\view\tour_images.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý ảnh Tour</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/tour_images.css" />
</head>
<body>
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="row g-4">
      <div class="col-lg-6 col-md-12">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h5>Thư mục ảnh</h5>
            <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#folderModal">+ Tạo</button>
          </div>
          <div class="card-body table-container">
            <table class="table table-bordered table-hover table-sm align-middle">
              <thead class="table-success">
                <tr><th>ID</th><th>Tên thư mục</th><th>Ảnh</th><th>Hành động</th></tr>
              </thead>
              <tbody id="folderTableBody">
                <tr><td colspan="4" class="text-center">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-6 col-md-12">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5>Gán ảnh cho Tour</h5>
            <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#assignModal">+ Gán</button>
          </div>
          <div class="card-body table-container">
            <table class="table table-bordered table-hover table-sm">
              <thead class="table-primary">
                <tr><th>ID</th><th>Tour</th><th>Ảnh</th><th>Thư mục</th><th>Hành động</th></tr>
              </thead>
              <tbody id="assignTableBody">
                <tr><td colspan="5" class="text-center">Đang tải...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal tạo thư mục -->
  <div class="modal fade" id="folderModal" tabindex="-1">
    <div class="modal-dialog">
      <form id="folderForm" class="modal-content">
        <div class="modal-header bg-success text-white"><h5>Tạo thư mục</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><input type="text" id="folder_name" class="form-control" required></div>
        <div class="modal-footer"><button type="submit" class="btn btn-success">Lưu</button></div>
      </form>
    </div>
  </div>

  <!-- Modal tải ảnh -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <form id="uploadForm" enctype="multipart/form-data" class="modal-content">
        <div class="modal-header bg-secondary text-white"><h5>Thêm ảnh</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <select id="folderSelect" class="form-select mb-3" required></select>
          <input type="file" name="tour_images" multiple class="form-control" accept="image/*" required>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-secondary">Tải lên</button></div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
      <form id="assignForm" class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5>Gán ảnh</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
  
        <div class="modal-body">
          <select id="tourSelect" class="form-select mb-3" required></select>
  
          <select id="folderSelectAssign" class="form-select mb-3" required>
            <option value="">-- Chọn thư mục --</option>
          </select>
  
          <div id="imgSelect" class="border rounded p-2" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
  
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Gán</button>
        </div>
      </form>
    </div>
  </div>  

  <script>fetch("sidebar.html").then(r=>r.text()).then(h=>document.getElementById("sidebar-container").innerHTML=h);</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/tour_folders.js"></script>
  <script src="../js/tour_images.js"></script>  
</body>
</html>
