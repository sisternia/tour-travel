<!-- admin/view/tour_category_type.html -->
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Loại và Kiểu Tour</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/tour_category_type.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="row g-4">
        <!-- BẢNG LOẠI TOUR -->
        <div class="col-lg-6 col-md-12">
          <div class="card shadow-sm">
            <div
              class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Loại Tour</h5>
              <button
                class="btn btn-light btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#categoryModal"
              >
                + Thêm
              </button>
            </div>
            <div class="card-body table-container">
              <table class="table table-bordered table-hover table-sm">
                <thead class="table-primary">
                  <tr>
                    <th>ID</th>
                    <th>Tên loại</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="categoriesTableBody">
                  <tr>
                    <td colspan="4" class="text-center">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- BẢNG KIỂU TOUR -->
        <div class="col-lg-6 col-md-12">
          <div class="card shadow-sm">
            <div
              class="card-header bg-success text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">Kiểu Tour</h5>
              <button
                class="btn btn-light btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#typeModal"
              >
                + Thêm
              </button>
            </div>
            <div class="card-body table-container">
              <table class="table table-bordered table-hover table-sm">
                <thead class="table-success">
                  <tr>
                    <th>ID</th>
                    <th>Tên kiểu</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="tourTypeTableBody">
                  <tr>
                    <td colspan="4" class="text-center">Đang tải...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Loại Tour -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
      <div class="modal-dialog">
        <form
          id="categoriesForm"
          enctype="multipart/form-data"
          class="modal-content"
        >
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Thêm Loại Tour</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editCategoryId" />
            <div class="mb-3">
              <label>ID Loại Tour</label>
              <input
                type="text"
                class="form-control"
                id="categoryId"
                disabled
              />
            </div>
            <div class="mb-3">
              <label>Tên Loại Tour</label>
              <input
                type="text"
                class="form-control"
                id="categoryName"
                required
              />
            </div>
            <div class="mb-3">
              <label>Trạng thái</label>
              <input type="file" class="form-control" id="categoryImage" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal Kiểu Tour -->
    <div class="modal fade" id="typeModal" tabindex="-1">
      <div class="modal-dialog">
        <form
          id="tourTypeForm"
          enctype="multipart/form-data"
          class="modal-content"
        >
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Thêm Kiểu Tour</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editTypeId" />
            <div class="mb-3">
              <label>ID Kiểu Tour</label>
              <input type="text" class="form-control" id="typeId" disabled />
            </div>
            <div class="mb-3">
              <label>Tên Kiểu Tour</label>
              <input type="text" class="form-control" id="typeName" required />
            </div>
            <div class="mb-3">
              <label>Hình ảnh</label>
              <input type="file" class="form-control" id="typeImage" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Lưu</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="../js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/tour_categories.js"></script>
    <script src="../js/tour_type.js"></script>
  </body>
</html>
